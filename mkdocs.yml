site_name: CUDA 并行编程完全指南
site_description: 从 GPU 硬件架构到张量核心实战，共 6 个部分、54 章
site_author: J.Liu
site_url: https://zhaojiew10.github.io/cuda-ebook/
repo_url: https://github.com/zhaojiew10/cuda-ebook
edit_uri: edit/main/docs/

docs_dir: docs
site_dir: site

theme:
  name: material
  language: zh
  features:
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - toc.follow
    - search.highlight
    - search.suggest
    - content.code.copy

plugins:
  - search:
      lang:
        - en
        - zh

markdown_extensions:
  - tables
  - def_list
  - attr_list
  - md_in_html
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences

